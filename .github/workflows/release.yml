name: Release

# The repository holds no Firebase configuration and no keystore. Everything is
# injected from the repository secrets (see docs/SETUP.md).

on:
  push:
    tags: ['v*']

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android → Firebase App Distribution
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Restore Firebase config and keystore (never committed)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          FIREBASE_OPTIONS_DART: ${{ secrets.FIREBASE_OPTIONS_DART }}
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
        run: |
          printf '%s' "$GOOGLE_SERVICES_JSON" | base64 --decode > android/app/google-services.json
          printf '%s' "$FIREBASE_OPTIONS_DART" | base64 --decode > lib/firebase_options.dart
          printf '%s' "$ANDROID_KEYSTORE" | base64 --decode > "$RUNNER_TEMP/release.keystore"

      - name: Check the restored Firebase config
        run: |
          # google-services.json only yields the default_web_client_id string
          # resource when it carries a client_type 3 entry. Without it Google
          # Sign-In compiles fine and fails on the device, so fail here instead.
          python3 - <<'PY'
          import hashlib, json, sys
          raw = open('android/app/google-services.json', 'rb').read()
          print('sha256:', hashlib.sha256(raw).hexdigest()[:16])
          clients = json.loads(raw)['client']
          for c in clients:
              pkg = c['client_info']['android_client_info']['package_name']
              types = sorted(o['client_type'] for o in c.get('oauth_client', []))
              print(f'  {pkg}: oauth_client types {types}')
          if not any(o['client_type'] == 3
                     for c in clients for o in c.get('oauth_client', [])):
              sys.exit('No client_type 3 (web) OAuth client: sign-in would fail.')
          PY

      - name: Dependencies and code generation
        run: |
          flutter pub get
          dart run build_runner build --delete-conflicting-outputs

      - name: Tests
        run: flutter test

      - name: Build release APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          GOOGLE_SERVER_CLIENT_ID: ${{ secrets.GOOGLE_SERVER_CLIENT_ID }}
          METADATA_PROXY_URL: ${{ secrets.METADATA_PROXY_URL }}
        run: |
          # App Distribution rejects a build number that goes backwards, and the
          # run number restarts at 1 on a workflow it has never run before.
          flutter build apk --release \
            --build-number=$(( 100 + GITHUB_RUN_NUMBER )) \
            --dart-define=GOOGLE_SERVER_CLIENT_ID="$GOOGLE_SERVER_CLIENT_ID" \
            --dart-define=METADATA_PROXY_URL="$METADATA_PROXY_URL"

      - uses: actions/upload-artifact@v7
        with:
          name: app-release-${{ github.ref_name }}
          path: build/app/outputs/flutter-apk/*.apk

      - name: Distribute to testers
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_ANDROID_APP_ID: ${{ secrets.FIREBASE_ANDROID_APP_ID }}
        run: |
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/service-account.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/service-account.json"
          npx --yes firebase-tools@latest appdistribution:distribute \
            build/app/outputs/flutter-apk/app-release.apk \
            --app "$FIREBASE_ANDROID_APP_ID" \
            --groups testers \
            --release-notes "$GITHUB_REF_NAME"
